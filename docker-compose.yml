services:
  redis:
    image: redis:7-alpine
    container_name: quran-lms-redis
    restart: always
    ports:
      - "${REDIS_PORT_BINDING:-6379:6379}"
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:v1.9.0
    container_name: quran-lms-livekit
    restart: always
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  egress:
    image: livekit/egress:latest
    container_name: quran-lms-egress
    restart: always
    shm_size: '2g'
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress/config.yaml
      - EGRESS_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - EGRESS_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - EGRESS_WS_URL=${LIVEKIT_WS_URL:-ws://livekit:7880}
      - EGRESS_INSECURE=true
    volumes:
      - ./egress.yaml:/etc/egress/config.yaml
    cap_add:
      - SYS_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - livekit

  nestjs:
    env_file:
      - .env
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: quran-lms-nestjs
    restart: unless-stopped
    ports:
      - "${NESTJS_PORT_BINDING:-5000:5000}"
      - "${WS_PORT_BINDING:-5001:5001}"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: ${NESTJS_PORT:-${PORT:-5000}}
      WS_PORT: ${WS_PORT:-5001}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-your-secret-jwt-key-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-jwt-key-change-in-prod}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_HOST: ${LIVEKIT_HOST:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      RECORDINGS_DIR: ${RECORDINGS_DIR:-/app/recordings}
      VOSK_SERVER_URL: ${VOSK_SERVER_URL:-ws://vosk:2700}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - livekit

  nextjs:
    env_file:
      - .env
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: quran-lms-nextjs
    restart: unless-stopped
    ports:
      - "${NEXTJS_PORT_BINDING:-3030:3030}"
    environment:
      PORT: ${NEXTJS_PORT:-3030}
      HOSTNAME: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5001}
    depends_on:
      - nestjs

volumes:
  redis_data:
  uploads_data:

