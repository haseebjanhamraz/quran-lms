# ==============================================================================
# Ain Ul Quran Production Docker Compose Override File
# ==============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.9.0
    container_name: quran-lms-livekit
    restart: always
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit-prod.yaml:/etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  egress:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./egress.yaml:/etc/egress/config.yaml
      - recordings_data:/recordings
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  nestjs:
    env_file:
      - .env
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runner
    restart: always
    command: ["node", "dist/main"]
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: ${NESTJS_PORT:-${PORT:-5000}}
      WS_PORT: ${WS_PORT:-5001}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HOST: ${LIVEKIT_HOST}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      RECORDINGS_DIR: ${RECORDINGS_DIR}
      VOSK_SERVER_URL: ${VOSK_SERVER_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - recordings_data:/app/recordings
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  nextjs:
    env_file:
      - .env
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: always
    command: ["node", "server.js"]
    environment:
      PORT: ${NEXTJS_PORT:-3030}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NODE_ENV: production
    volumes: []
    depends_on:
      nestjs:
        condition: service_started

volumes:
  redis_data:
  recordings_data:
  uploads_data:

